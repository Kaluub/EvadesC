    <title>Evades Map Viewer</title>

            margin: 0px;

        }

        .repo-box {
            position: absolute;
            bottom: 10px;
            left: 10px;
            filter: invert(100%) opacity(70%);
        }

        .repo-box:hover {
            filter: invert(100%) opacity(90%);
        }

                        console.log(text);
